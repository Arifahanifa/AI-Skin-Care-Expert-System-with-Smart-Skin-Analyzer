services:
  # Python Flask Backend Web Service
  - type: web
    name: ai-skin-care-expert-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: CORS_ORIGINS
        value: "*"

  # React Vite Frontend Static Site
  - type: web
    name: ai-skin-care-expert-frontend
    runtime: static
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-skin-care-expert-backend
          property: host
